services:
  gemini-web2api:
    image: gemini-web2api-local:latency
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - web2api-data:/data
      - ./low-latency.json:/app/config.json:ro
    environment:
      ADMIN_TOKEN: "${ADMIN_TOKEN:?Set ADMIN_TOKEN before starting}"
      TZ: Asia/Hong_Kong
    command: ["--config", "/app/config.json"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  web2api-data:
